<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'"
    />
    <title>Letterflow – Einrichtung</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <main>
      <div class="marke"><span class="logo" aria-hidden="true">ℓ</span><b>Letterflow</b></div>
      <h1>Willkommen bei Letterflow</h1>
      <p id="intro" class="lead">Letterflow lädt einmalig die Sprachmodelle herunter …</p>
      <div class="karte surface">
        <progress id="balken" max="100" value="0" aria-label="Gesamtfortschritt"></progress>
        <p id="fortschritt-text" class="leise" aria-live="off">Wird vorbereitet …</p>
      </div>
      <p id="fehler" class="fehler" role="alert" hidden></p>
      <button id="erneut" class="knopf haupt" type="button" hidden>Erneut versuchen</button>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
