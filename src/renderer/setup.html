<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'"
    />
    <title>Letterflow – Einrichtung</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <main>
      <div class="marke"><span class="logo" aria-hidden="true">ℓ</span><b>Letterflow</b></div>
      <h1>Willkommen bei Letterflow</h1>
      <section id="wahl" hidden>
        <h2 id="h-wahl">Wie gründlich soll Letterflow deinen Text glätten?</h2>
        <div class="gruppe" role="radiogroup" aria-labelledby="h-wahl">
          <label class="zeile wahl">
            <input type="radio" name="stufe" value="schnell" />
            <span class="kreis" aria-hidden="true"></span>
            <span class="text"
              ><b>Schnell</b
              ><span
                >Sofort, ohne Zusatz-Download. Entfernt Füllwörter und setzt Satzzeichen.</span
              ></span
            >
          </label>
          <label class="zeile wahl">
            <input type="radio" name="stufe" value="ausgewogen" />
            <span class="kreis" aria-hidden="true"></span>
            <span class="text"
              ><b>Ausgewogen</b
              ><span
                >Etwas genauer als Schnell, schont den PC. Lädt einmalig zusätzlich ca. 1,1
                GB.</span
              ></span
            >
          </label>
          <label class="zeile wahl">
            <input type="radio" name="stufe" value="gruendlich" />
            <span class="kreis" aria-hidden="true"></span>
            <span class="text"
              ><b>Gründlich <span class="etikett">Grafikkarte nötig</span></b
              ><span
                >Wendet auch Selbstkorrekturen an („Montag, nein, Dienstag“) und setzt Listen. Lädt
                einmalig zusätzlich ca. 2,5 GB. Ohne Grafikkarte (NVIDIA oder ab 6 GB
                Grafikspeicher) dauert jedes Diktat deutlich länger.</span
              ></span
            >
          </label>
        </div>
        <p class="leise klein">Empfohlen ist, was zu deinem PC passt. Später jederzeit änderbar.</p>
        <button id="weiter" class="knopf haupt" type="button">Weiter</button>
      </section>
      <p id="intro" class="lead" hidden>Letterflow lädt einmalig die Sprachmodelle herunter …</p>
      <div id="laden" class="gruppe" hidden>
        <div class="zeile fortschritt">
          <progress id="balken" max="100" value="0" aria-label="Gesamtfortschritt"></progress>
          <p id="fortschritt-text" class="leise" aria-live="off">Wird vorbereitet …</p>
        </div>
      </div>
      <p id="fehler" class="fehler" role="alert" hidden></p>
      <button id="erneut" class="knopf haupt" type="button" hidden>Erneut versuchen</button>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
