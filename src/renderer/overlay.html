<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; font-src 'self'; img-src data:"
    />
    <title>Letterflow</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="pille.css" />
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="schatten" class="schatten" aria-hidden="true"></div>
    <div id="pille" class="pille">
      <canvas id="glas" class="glas" aria-hidden="true"></canvas>
      <span class="milch"></span><span class="spec"></span>
      <span id="symbol" class="symbol" aria-hidden="true"><img id="bild" alt="" /></span>
      <span class="meta">
        <b id="zeile1" class="zeile1"></b>
        <span id="zeile2" class="zeile2"></span>
      </span>
      <span class="rechts" aria-hidden="true">
        <span id="balken" class="balken"><span id="pegelbalken" class="pegelbalken"></span></span>
        <span class="lader"></span>
        <span class="haken">
          <svg viewBox="0 0 12 12"><path d="M2.5 6.3l2.3 2.3 4.7-5" /></svg>
        </span>
      </span>
      <span class="rim"></span>
    </div>
    <div id="ansage" class="ansage" role="status" aria-live="polite"></div>
    <script src="pille-glas.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
