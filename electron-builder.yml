appId: de.letterflow.app
productName: Letterflow
directories:
  output: dist
files:
  - package.json
  - src/**/*
  - assets/**/*
  - models.json
  - engines.json
  - DRITTANBIETER.md
  - '!src/**/*.md'
asar: true
# Native Dateien müssen außerhalb des Archivs liegen, damit der ASR-Worker sie laden kann.
asarUnpack:
  - '**/*.node'
  - '**/*.dll'
extraResources:
  - from: resources/engines
    to: engines
  - from: resources/bin
    to: bin
win:
  target: nsis
  icon: assets/letterflow.ico
  artifactName: Letterflow-Setup-${version}.${ext}
# Geführter Installer auf Deutsch: Frage nach der Desktop-Verknüpfung und Abschlussseite mit
# „Letterflow starten“ (build/installer.nsh); Desktop-Verknüpfung legt das Skript an.
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  installerLanguages: [de_DE]
  language: '1031'
  createDesktopShortcut: false
  createStartMenuShortcut: true
  installerIcon: assets/letterflow.ico
  uninstallerIcon: assets/letterflow.ico
  deleteAppDataOnUninstall: false
