<!doctype html><html lang="de"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Outfit:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{font-family:Inter,sans-serif;width:1200px;background:#05090a;color:#e9f4f2;padding:28px}
h1{font:600 20px Outfit;margin:0 0 4px}p.sub{color:#8fb0aa;font-size:13px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.scene{position:relative;height:170px;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bunt{background:radial-gradient(circle at 20% 30%,#ff8a5c 0,transparent 42%),radial-gradient(circle at 78% 20%,#2dd4bf 0,transparent 44%),radial-gradient(circle at 60% 90%,#3b82f6 0,transparent 46%),#1e293b}
.weiss{background:#fff}
.lbl{position:absolute;left:12px;top:10px;font:600 10.5px Inter;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.75)}.weiss .lbl{color:#6a7a7e}
.pill{position:relative;display:flex;align-items:center;height:52px;padding:0 18px 0 12px;border-radius:26px;color:#fff;overflow:hidden;
 background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(18,30,29,.42) 45%,rgba(6,14,13,.62)),rgba(10,18,17,.30);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(255,255,255,.14),0 12px 32px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.4)}
.pill:before{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 70% at 30% -20%,rgba(255,255,255,.40),transparent 55%);pointer-events:none}
.ic{position:relative;flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font:700 15px Outfit;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.claude{background:#D97757}.word{background:#185abd}.chrome{background:conic-gradient(#ea4335 0 33%,#fbbc05 0 66%,#34a853 0);border-radius:50%}.chrome:after{content:'';width:11px;height:11px;border-radius:50%;background:#4285f4;box-shadow:0 0 0 2px #fff}
.wave{position:relative;display:flex;align-items:center;gap:2.5px;height:30px;margin-left:16px}
.wave i{display:block;width:3px;border-radius:2px;background:linear-gradient(180deg,#c9fff4,#2dd4bf);box-shadow:0 0 6px rgba(60,196,174,.6)}
.dot{position:relative;width:8px;height:8px;border-radius:50%;margin-left:14px;background:#5EEAD4;box-shadow:0 0 8px #5EEAD4}
.t{position:relative;margin-left:12px;display:flex;flex-direction:column;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.t b{font:600 14px Inter}.t span{font:500 12.5px Inter;color:#d3e4e0}
.chk{position:relative;margin-left:14px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(94,234,212,.18);box-shadow:inset 0 0 0 1px rgba(94,234,212,.55)}
.chk svg{width:12px;height:12px;stroke:#5EEAD4;stroke-width:2.6;fill:none}
.warn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#FDBA74;color:#1F0F04;font:800 15px Inter;position:relative}
kbd{font:600 11px Inter;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
/* Animation Liquid-Drop: Einzelbilder */
.f1{width:52px;padding:0;justify-content:center;transform:scale(.55);opacity:.7}
.f2{width:120px;padding:0;justify-content:center;transform:scale(1.04)}
</style></head><body>
<h1>Pille · nur Symbol, größer · Liquid-Drop</h1><p class="sub">52 px hoch · scharfes 28-px-Symbol · feinere, höhere Wellenform (22 Balken) · Erfolg „Eingefügt ✓“ · Warnung behält Text</p>
<div class="grid" id="g"></div>
<script>
const w=(n,s,a)=>'<span class="wave">'+Array.from({length:n},(_,i)=>`<i style="height:${4+Math.round(a*Math.abs(Math.sin((i+s)*0.9)*Math.cos((i+s)*0.37)))}px"></i>`).join('')+'</span>';
const S=[['bunt','Zuhören · Claude',`<div class="pill"><span class="ic claude">✳</span>${w(22,1,24)}<span class="dot"></span></div>`],
['weiss','Zuhören · leise Stimme',`<div class="pill"><span class="ic word">W</span>${w(22,3,10)}<span class="dot"></span></div>`],
['bunt','Erfolg',`<div class="pill"><span class="ic chrome"></span><span class="t"><b>Eingefügt</b><span>12 Wörter</span></span><span class="chk"><svg viewBox="0 0 12 12"><path d="M2.5 6.3l2.3 2.3 4.7-5"/></svg></span></div>`],
['weiss','Warnung',`<div class="pill"><span class="warn">!</span><span class="t"><b>Kein Textfeld aktiv</b><span>Mit <kbd>Strg</kbd> <kbd>V</kbd> einfügen</span></span></div>`],
['bunt','Liquid-Drop · 0–90 ms: Tropfen ploppt auf',`<div class="pill f1"><span class="ic claude" style="transform:scale(.6)">✳</span></div>`],
['bunt','90–200 ms: dehnt sich, minimales Nachfedern',`<div class="pill f2"><span class="ic claude">✳</span></div>`]];
document.getElementById('g').innerHTML=S.map(([c,l,p])=>`<div class="scene ${c}"><span class="lbl">${l}</span>${p}</div>`).join('');
</script></body></html>
