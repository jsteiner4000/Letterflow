<!doctype html><html lang="de"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}body{background:#000;width:1200px;font-family:"Segoe UI",sans-serif;color:#fff;padding:20px}
h1{font:600 18px "Segoe UI";margin:0 0 4px}p{color:#9ab;font-size:12.5px;margin:0 0 14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.scene{position:relative;height:300px;border-radius:12px;overflow:hidden}
canvas.bg{position:absolute;inset:0}
.pillwrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.glass{position:relative;width:240px;height:56px;border-radius:28px;overflow:hidden;
 box-shadow:0 10px 28px rgba(0,0,0,.30),0 2px 6px rgba(0,0,0,.18)}
.glass canvas{position:absolute;inset:0;width:100%;height:100%}
.tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.14));backdrop-filter:none}.glass canvas{filter:blur(1.2px) saturate(1.15)}
.rim{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 box-shadow:inset 1.5px 1.5px 1px rgba(255,255,255,.75),inset -1px -1px 1px rgba(255,255,255,.35),inset 0 0 0 .5px rgba(255,255,255,.35),inset 0 -8px 14px rgba(0,0,0,.10),inset 0 8px 16px rgba(255,255,255,.10)}
.spec{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(60% 90% at 18% 0%,rgba(255,255,255,.35),transparent 55%);mix-blend-mode:screen}
.content{position:absolute;inset:0;display:flex;align-items:center;padding:0 18px 0 14px}
.ic{width:28px;height:28px;border-radius:7px;background:#D97757;display:grid;place-items:center;font:700 15px "Segoe UI";box-shadow:0 1px 3px rgba(0,0,0,.3)}
.wave{display:flex;align-items:center;gap:2.5px;height:30px;margin-left:16px}
.wave i{width:3px;border-radius:2px;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.55)}
.dot{width:8px;height:8px;border-radius:50%;background:#5EEAD4;margin-left:14px;box-shadow:0 0 8px #5EEAD4}
.light .wave i{background:#1d1d1f;box-shadow:none}.light .tint{background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.20))}.light .glass{box-shadow:0 10px 28px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.12)}.light .rim{box-shadow:inset 1.5px 1.5px 1px rgba(255,255,255,.9),inset -1px -1px 1px rgba(255,255,255,.6),inset 0 0 0 .5px rgba(0,0,0,.18),inset 0 -8px 14px rgba(0,0,0,.06)}
.lbl{position:absolute;left:10px;top:8px;font:600 11px "Segoe UI";letter-spacing:.05em;text-transform:uppercase;text-shadow:0 1px 2px #000}
</style></head><body>
<h1>Pille wie Apple-Glas</h1><p>Klares Glas · Hintergrund wird an den Rändern wie durch eine dicke Linse gebogen, in der Mitte leicht vergrößert · feine Lichtkante · minimale Tönung</p>
<div class="row" id="r"></div>
<script>
function drawBg(ctx,w,h,kind){
 if(kind==='foto'){const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#c9774e');g.addColorStop(.5,'#3a5f7a');g.addColorStop(1,'#1d2b38');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#f3d2b8';ctx.beginPath();ctx.arc(w*.3,h*.55,80,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(w*.55,h*.2,w*.4,h*.6);
  ctx.fillStyle='#111';ctx.font='bold 38px Segoe UI';ctx.fillText('PC Release',w*.57,h*.45);ctx.fillText('kommt 2027!',w*.57,h*.62);}
 else{ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.fillStyle='#222';ctx.font='17px Georgia';
  const t='Hallo Tim, ich schick dir das Meeting-Recap nach dem Standup. Lass uns morgen kurz drüber sprechen, ob wir das Feature noch in den Sprint nehmen. Die Zahlen aus dem Report sehen gut aus und das Testing läuft.';
  let y=40,line='';for(const wd of t.split(' ')){if(ctx.measureText(line+wd).width>w-60){ctx.fillText(line,30,y);y+=30;line='';}line+=wd+' ';}ctx.fillText(line,30,y);
  ctx.fillStyle='#2b579a';ctx.fillRect(30,y+30,180,40);ctx.fillStyle='#e8a33d';ctx.fillRect(230,y+30,140,40);}
}
function lens(src,sx,sy,W,H,S){ // S = pixel scale
 const out=new ImageData(W*S,H*S),r=H*S/2,cx=W*S/2,cy=H*S/2,rim=16*S;
 const sp=src.data,sw=src.width;
 for(let y=0;y<H*S;y++)for(let x=0;x<W*S;x++){
  // Abstand zum Pillenrand (abgerundetes Rechteck)
  const qx=Math.max(Math.abs(x-cx)-(cx-r),0),qy=Math.abs(y-cy);const dEdge=r-Math.hypot(qx,qy);
  if(dEdge<0)continue;
  let nx=0,ny=0;const L=Math.hypot(qx*Math.sign(x-cx),qy*Math.sign(y-cy));if(L>0){nx=qx*Math.sign(x-cx)/L;ny=(y-cy)/Math.max(Math.hypot(qx,qy),1e-3);}
  const t=Math.max(0,1-dEdge/rim);const bend=Math.pow(t,2.2)*rim*1.8; // starke Biegung am Rand
  const mag=1/1.07; // Mitte leicht vergrößert
  const o=4*(y*W*S+x);
  for(let c=0;c<3;c++){const k=1+(c-1)*0.06; // Farbsaum
   let px=cx+(x-cx)*mag+nx*bend*k, py=cy+(y-cy)*mag+ny*bend*k;
   px=Math.round(sx*S+px);py=Math.round(sy*S+py);px=Math.min(Math.max(px,0),sw-1);py=Math.min(Math.max(py,0),src.height-1);
   out.data[o+c]=sp[4*(py*sw+px)+c];}
  out.data[o+3]=255;}
 return out;}
const W=240,H=56,S=2;
const scenes=[['foto','Über Video/Foto'],['text','Über Dokument']];
document.getElementById('r').innerHTML=scenes.map(([k,l],i)=>`<div class="scene ${k==='text'?'light':''}"><canvas class="bg" id="b${i}" width="1144" height="600" style="width:572px;height:300px"></canvas><span class="lbl">${l}</span><div class="pillwrap"><div class="glass"><canvas id="g${i}" width="${W*S}" height="${H*S}"></canvas><div class="tint"></div><div class="spec"></div><div class="content"><span class="ic">✳</span><span class="wave">${Array.from({length:22},(_,j)=>`<i style="height:${5+Math.round(22*Math.abs(Math.sin((j+i)*0.9)*Math.cos((j+i)*.37)))}px"></i>`).join('')}</span><span class="dot"></span></div><div class="rim"></div></div></div></div>`).join('');
scenes.forEach(([k],i)=>{const b=document.getElementById('b'+i),ctx=b.getContext('2d');ctx.scale(2,2);drawBg(ctx,572,300,k);
 const src=ctx.getImageData(0,0,b.width,b.height);const sx=(572-W)/2,sy=(300-H)/2;
 document.getElementById('g'+i).getContext('2d').putImageData(lens(src,sx,sy,W,H,S),0,0);});
</script></body></html>
