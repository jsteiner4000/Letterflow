name: Auto-Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # für die Release-Notizen aus dem Versions-Commit
      - name: Version lesen und Tag prüfen
        id: v
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "neu=false" >> "$GITHUB_OUTPUT"
          else
            echo "neu=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.v.outputs.neu == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Bauen und prüfen
        if: steps.v.outputs.neu == 'true'
        shell: bash
        run: |
          npm ci
          npm run engines
          npm run helper
          # Oberflächentests brauchen einen echten Bildschirm und laufen lokal vor dem Push
          npx playwright test tests/unit
          npm run dist
      - name: Release anlegen
        if: steps.v.outputs.neu == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Letterflow-Setup.exe ohne Versionsnummer: fester Link …/releases/latest/download/Letterflow-Setup.exe
        # für Website und README. Notizen = Beschreibung des Commits mit „Version x.y.z“ im Titel (ohne Co-Authored-By).
        run: |
          V="${{ steps.v.outputs.version }}"
          cp "dist/Letterflow-Setup-$V.exe" dist/Letterflow-Setup.exe
          C=$(git log -1 --format=%H --grep="Version $V" "$GITHUB_SHA"); C=${C:-$GITHUB_SHA}
          git log -1 --format=%b "$C" | grep -v '^Co-Authored-By:' > notizen.md
          gh release create "v$V" "dist/Letterflow-Setup-$V.exe" "dist/Letterflow-Setup-$V.exe.blockmap" dist/latest.yml dist/Letterflow-Setup.exe \
            --target "$GITHUB_SHA" --title "Letterflow $V" --notes-file notizen.md
